[package]
name = "hyperlane"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = """A lightweight, high-performance, and cross-platform Rust HTTP server library built on Tokio. It simplifies modern web service development by providing built-in support for middleware, WebSocket, Server-Sent Events (SSE), and raw TCP communication. With a unified and ergonomic API across Windows, Linux, and MacOS, it enables developers to build robust, scalable, and event-driven network applications with minimal overhead and maximum flexibility."""
keywords = ["http", "request", "response", "tcp", "cross-platform"]
repository.workspace = true
categories = ["network-programming", "web-programming"]
exclude.workspace = true

[workspace.package]
version = "21.10.0"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
repository = "https://github.com/hyperlane-dev/hyperlane.git"
exclude = ["target", "Cargo.lock", "sh", ".github", "logs", "img", "**/*.log"]

[workspace]
resolver = "2"
members = ["compress", "constant", "type", "request", "core", "macros", "cli", "plugin/websocket"]

[workspace.dependencies]
hyperlane = { path = ".", version = "21.10.0" }
http-type = { path = "type", version = "21.10.0" }
hyperlane-cli = { path = "cli", version = "21.10.0" }
hyperlane-core = { path = "core", version = "21.10.0" }
http-request = { path = "request", version = "21.10.0" }
http-compress = { path = "compress", version = "21.10.0" }
http-constant = { path = "constant", version = "21.10.0" }
hyperlane-macros = { path = "macros", version = "21.10.0" }
hyperlane-plugin-websocket = { path = "plugin/websocket", version = "21.10.0" }

hex = "0.4.3"
md5 = "0.8.1"
url = "2.5.8"
log = "0.4.34"
rand = "0.10.2"
redis = "1.4.1"
