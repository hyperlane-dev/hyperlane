uuid = { version = "1.24.0", features = [
    "v1",
    "v3",
    "v4",
    "v5",
    "v6",
    "v7",
    "v8",
    "md5",
    "rng",
    "sha1",
    "borsh",
    "serde",
    "bytemuck",
    "fast-rng",
    "rng-rand",
    "zerocopy",
    "arbitrary",
    "rng-getrandom",
    "macro-diagnostics",
