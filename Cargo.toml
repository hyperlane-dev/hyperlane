[package]
name = "hyperlane"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = """A lightweight, high-performance, and cross-platform Rust HTTP server library built on Tokio. It simplifies modern web service development by providing built-in support for middleware, WebSocket, Server-Sent Events (SSE), and raw TCP communication. With a unified and ergonomic API across Windows, Linux, and MacOS, it enables developers to build robust, scalable, and event-driven network applications with minimal overhead and maximum flexibility."""
keywords = ["http", "request", "response", "tcp", "cross-platform"]
repository.workspace = true
categories = ["network-programming", "web-programming"]
exclude.workspace = true

[workspace.package]
version = "22.4.0"
readme = "README.md"
edition = "2024"
authors = ["root@devhub.vip"]
license = "MIT"
repository = "https://github.com/hyperlane-dev/hyperlane.git"
exclude = [
    "target",
    "Cargo.lock",
    "sh",
    ".github",
    ".codegraph",
    "logs",
    "img",
    "**/*.log",
    "certs/**",
    "results/**",
    "results2/**",
]

[workspace]
resolver = "2"
members = [
    "compress",
    "constant",
    "type",
    "request",
    "core",
    "macros",
    "cli",
    "plugin/logger",
    "plugin/websocket",
    "performance",
]

[workspace.dependencies]
hyperlane = { path = ".", version = "22.4.0" }
http-type = { path = "type", version = "22.4.0" }
hyperlane-core = { path = "core", version = "22.4.0" }
http-compress = { path = "compress", version = "22.4.0" }
http-constant = { path = "constant", version = "22.4.0" }
hyperlane-macros = { path = "macros", version = "22.4.0" }

h3 = "0.0.8"
h2 = "0.4.20"
hex = "0.4.3"
url = "2.5.8"
http = "1.5.0"
log = "0.4.34"
futures = "0.3"
brotli = "9.0.0"
bytes = "1.12.1"
quote = "1.0.47"
regex = "1.13.1"
flate2 = "1.1.10"
h3-quinn = "0.0.10"
twox-hash = "2.1.4"
inventory = "0.3.24"
thiserror = "2.0.21"
toml_edit = "0.25.17"
serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
webpki-roots = "1.0.9"
color-output = "10.3.1"
proc-macro2 = "1.0.107"
lombok-macros = "10.3.1"
serde_urlencoded = "0.7.1"
tokio-broadcast = "10.3.1"
syn = { version = "3.0.6", features = ["full"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
notify = { version = "8.2.0", default-features = false, features = [
    "macos_fsevent",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "std",
    "ring",
    "tls12",
] }
quinn = { version = "0.11.12", default-features = false, features = [
    "log",
    "rustls-ring",
    "runtime-tokio",
] }

[dependencies]
hyperlane-core = { workspace = true }
hyperlane-macros = { workspace = true }

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"
