serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
tungstenite = "0.30.0"
webpki-roots = "1.0.9"
clonelicious = "2.2.28"
color-output = "10.2.2"
proc-macro2 = "1.0.107"
hyperlane-log = "4.0.16"
lombok-macros = "10.2.2"
