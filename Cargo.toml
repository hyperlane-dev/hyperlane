ahash = "0.8.12"
brotli = "9.0.0"
quote = "1.0.47"
regex = "1.13.1"
base64 = "0.22.1"
chrono = "0.4.45"
flate2 = "1.1.10"
dotenvy = "0.15.7"
futures = "0.3.34"
lettre = "0.11.22"
