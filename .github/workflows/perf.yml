name: Performance

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PERF_CONNECTIONS: '64 256'
      PERF_CONNECTIONS_SHORT: '16 64'
      PERF_DURATION: '12'
      PERF_REPEATS: '3'
      PERF_PROTOCOLS: 'h1 h1-tls h2c h2-tls h3'
      PERF_MODES: 'keepalive short'
      PERF_SERVER_CPUS: '1'
      PERF_LOADGEN_CPUS: '1'
      PERF_RESULTS: ${{ github.workspace }}/bench/results
      PERF_COOLDOWN_SHORT: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Resolve the baseline
        id: baseline
        run: |
          set -e
          BASE="$(git rev-parse HEAD^)"
          echo "Baseline commit: $BASE"
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Build the baseline context
        run: |
          set -e
          mkdir -p "${{ runner.temp }}/baseline"
          git archive "${{ steps.baseline.outputs.base }}" | tar -x -C "${{ runner.temp }}/baseline"
          ls "${{ runner.temp }}/baseline"

      - name: Build the images
        run: |
          set -e
          cd bench
          cargo run --locked -q -p bench-perf -- instrument ..
          cargo run --locked -q -p bench-perf -- build candidate ..
          cargo run --locked -q -p bench-perf -- build baseline "${{ runner.temp }}/baseline"

      - name: Measure
        run: |
          set -e
          cd bench
          cargo run --locked -q -p bench-perf -- bench candidate baseline

      - name: Report
        run: |
          set -e
          cd bench
          cargo run --locked -q -p bench-perf -- report | tee "${{ github.workspace }}/bench/results/report.txt"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}
          path: ${{ github.workspace }}/bench/results
          if-no-files-found: warn
