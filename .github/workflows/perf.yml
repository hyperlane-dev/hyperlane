name: Performance

on:
  pull_request:
    paths:
      - 'core/**'
      - 'type/**'
      - 'bench/**'
      - '.github/workflows/perf.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      connections:
        description: 'The concurrency levels to measure'
        required: false
        default: '64 256'
      connections_short:
        description: 'The concurrency levels to measure in short-connection mode'
        required: false
        default: '16 64'
      duration:
        description: 'The length of a measured window, in seconds'
        required: false
        default: '12'
      repeats:
        description: 'How many times each level is measured'
        required: false
        default: '3'
      protocols:
        description: 'The protocol variants to measure'
        required: false
        default: 'h1 h1-tls h2c h2-tls h3'
      modes:
        description: 'The connection modes to measure'
        required: false
        default: 'keepalive short'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PERF_CONNECTIONS: ${{ github.event.inputs.connections || '64 256' }}
      PERF_CONNECTIONS_SHORT: ${{ github.event.inputs.connections_short || '16 64' }}
      PERF_DURATION: ${{ github.event.inputs.duration || '12' }}
      PERF_REPEATS: ${{ github.event.inputs.repeats || '3' }}
      PERF_PROTOCOLS: ${{ github.event.inputs.protocols || 'h1 h1-tls h2c h2-tls h3' }}
      PERF_MODES: ${{ github.event.inputs.modes || 'keepalive short' }}
      PERF_SERVER_CPUS: '1'
      PERF_LOADGEN_CPUS: '1'
      PERF_RESULTS: ${{ github.workspace }}/bench/results
      PERF_COOLDOWN_SHORT: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the baseline
        id: baseline
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=0 origin master
            BASE="$(git merge-base origin/master HEAD)"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "Baseline commit: $BASE"
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Build the baseline context
        run: |
          set -e
          mkdir -p "${{ runner.temp }}/baseline"
          git archive "${{ steps.baseline.outputs.base }}" | tar -x -C "${{ runner.temp }}/baseline"
          ls "${{ runner.temp }}/baseline"

      - name: Build the images
        run: |
          set -e
          cd bench
          ./run-perf.sh instrument ..
          ./run-perf.sh build candidate ..
          ./run-perf.sh build baseline "${{ runner.temp }}/baseline"

      - name: Measure
        run: |
          set -e
          cd bench
          ./run-perf.sh bench candidate baseline

      - name: Report
        run: |
          set -e
          cd bench
          ./run-perf.sh report | tee "${{ github.workspace }}/bench/results/report.txt"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}
          path: ${{ github.workspace }}/bench/results
          if-no-files-found: warn
