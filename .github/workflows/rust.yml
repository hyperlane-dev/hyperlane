name: Rust
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      branch_name: ${{ steps.read.outputs.branch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Read workspace metadata
        id: read
        run: |
          VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Detected workspace version: $VERSION"
          echo "Branch: $BRANCH_NAME"
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Cargo.toml"
            exit 1
          fi
          if [ "$BRANCH_NAME" = "master" ]; then
            TAG="v$VERSION"
          else
            TAG="v$VERSION-$BRANCH_NAME"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

  check:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  tests:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Prepare environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test --workspace --all-features -- --nocapture

  clippy:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Load clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets

  build:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup build
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build release
        run: cargo check --release --workspace --all-features

  publish:
    permissions:
      contents: write
    needs: [setup, check, tests, clippy, build]
    if: always() && github.event_name == 'push' && github.ref_name == 'master' && needs.setup.outputs.tag != '' && needs.check.result == 'success' && needs.tests.result == 'success' && needs.clippy.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      bumped_version: ${{ steps.bump_sync.outputs.bumped_version }}
      bumped_tag: ${{ steps.bump_sync.outputs.bumped_tag }}
    steps:
      - name: Check branch
        id: check_branch
        run: |
          if [ "${{ needs.setup.outputs.branch_name }}" != "master" ]; then
            echo "Not on master branch, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "On master branch, proceeding with publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        if: steps.check_branch.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install crates-cli
        if: steps.check_branch.outputs.skip == 'false'
        run: cargo install --git https://github.com/crates-dev/ctares.git crates-cli
      - name: Bump and sync workspace versions
        id: bump_sync
        if: steps.check_branch.outputs.skip == 'false'
        run: |
          set -e
          cc bump --patch
          cc sync
          if git diff --quiet Cargo.toml; then
            echo "bump_sync_changed=false" >> $GITHUB_OUTPUT
            echo "Workspace versions already in sync"
          else
            echo "bump_sync_changed=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml
            BUMPED_VERSION="$(grep -E '^version[[:space:]]*=[[:space:]]*"' Cargo.toml | head -1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
            git commit -m "chore: bump version to v${BUMPED_VERSION} and sync workspace member deps"
            git push origin HEAD:master
            echo "Committed and pushed Cargo.toml bump + sync"
          fi
          BUMPED_VERSION="$(grep -E '^version[[:space:]]*=[[:space:]]*"' Cargo.toml | head -1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          BUMPED_TAG="v${BUMPED_VERSION}"
          echo "bumped_version=$BUMPED_VERSION" >> $GITHUB_OUTPUT
          echo "bumped_tag=$BUMPED_TAG" >> $GITHUB_OUTPUT
          echo "Bumped version: $BUMPED_VERSION (tag: $BUMPED_TAG)"
      - name: Publish to crates.io
        id: publish
        if: steps.check_branch.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          echo "${{ secrets.CARGO_REGISTRY_TOKEN }}" | cargo login
          cc publish
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "ALL PUBLISH SUCCESSFUL"

  release:
    needs: [setup, check, tests, clippy, build, publish]
    permissions:
      contents: write
      packages: write
    if: always() && github.event_name == 'push' && github.ref_name == 'master' && needs.publish.outputs.bumped_tag != '' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Check tag status
        id: check_tag
        run: |
          if git tag -l | grep -q "^${{ needs.publish.outputs.bumped_tag }}$"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ needs.publish.outputs.bumped_tag }} exists locally"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ needs.publish.outputs.bumped_tag }} does not exist locally"
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/${{ needs.publish.outputs.bumped_tag }}$"; then
            echo "remote_tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ needs.publish.outputs.bumped_tag }} exists on remote"
          else
            echo "remote_tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ needs.publish.outputs.bumped_tag }} does not exist on remote"
          fi
      - name: Check release status
        id: check_release
        run: |
          if gh release view "${{ needs.publish.outputs.bumped_tag }}" > /dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ needs.publish.outputs.bumped_tag }} already exists"
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ needs.publish.outputs.bumped_tag }} does not exist"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build source archive
        id: build_archive
        run: |
          set -e
          VERSION="${{ needs.publish.outputs.bumped_version }}"
          TAG="${{ needs.publish.outputs.bumped_tag }}"
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Building source archive for $REPO_NAME v$VERSION..."
          git archive --format=tar.gz --prefix="${REPO_NAME}-${VERSION}/" HEAD > "${REPO_NAME}-${VERSION}.tar.gz"
          echo "archive_path=${REPO_NAME}-${VERSION}.tar.gz" >> $GITHUB_OUTPUT
      - name: Create or update release
        id: release
        run: |
          set -e
          echo "released=false" >> $GITHUB_OUTPUT
          VERSION="${{ needs.publish.outputs.bumped_version }}"
          TAG="${{ needs.publish.outputs.bumped_tag }}"
          ARCHIVE="${{ steps.build_archive.outputs.archive_path }}"

          PACKAGES=(
            "http-compress"
            "http-constant"
            "http-type"
            "http-request"
            "hyperlane-core"
            "hyperlane-macros"
            "hyperlane"
            "hyperlane-cli"
          )

          NOTES_FILE="$(mktemp)"
          {
            printf '## Release %s\n\n' "$TAG"
            printf '| Package | crates.io | docs.rs |\n'
            printf '| --- | --- | --- |\n'
            for pkg in "${PACKAGES[@]}"; do
              printf '| `%s` | [crates.io](https://crates.io/crates/%s/%s) | [docs.rs](https://docs.rs/%s/%s) |\n' \
                "$pkg" "$pkg" "$VERSION" "$pkg" "$VERSION"
            done
            printf '\nCommit History: https://github.com/%s/commits/%s\n' \
              "${{ github.repository }}" "$TAG"
          } > "$NOTES_FILE"

          TITLE="$TAG (monorepo)"
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')

          if [ "${{ steps.check_release.outputs.release_exists }}" = "true" ]; then
            echo "Updating existing release: $TAG"
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read asset; do
              if [ -n "$asset" ]; then
                echo "Deleting asset: $asset"
                gh release delete-asset "$TAG" "$asset" --yes || true
              fi
            done
            if gh release edit "$TAG" \
                --title "$TITLE (updated $TIMESTAMP)" \
                --notes-file "$NOTES_FILE" \
                && gh release upload "$TAG" "$ARCHIVE" --clobber; then
              echo "released=true" >> $GITHUB_OUTPUT
              echo "Updated release $TAG"
            else
              echo "Failed to update release"
              exit 1
            fi
          else
            if [ "${{ steps.check_tag.outputs.remote_tag_exists }}" = "false" ]; then
              echo "Creating and pushing tag: $TAG"
              git tag "$TAG"
              git push origin "$TAG"
            fi
            echo "Creating new release: $TAG"
            if gh release create "$TAG" \
                --title "$TITLE" \
                --notes-file "$NOTES_FILE" \
                --latest \
                && gh release upload "$TAG" "$ARCHIVE"; then
              echo "released=true" >> $GITHUB_OUTPUT
              echo "Created release $TAG"
              echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
            else
              echo "Failed to create release"
              exit 1
            fi
          fi

          rm -f "$NOTES_FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
